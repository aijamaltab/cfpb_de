# Подключение dbt. Пароля в файле нет: его берёт переменная окружения DBT_PASSWORD (read -s, см. README).
tabyldieva_dwh:
  target: postgres
  outputs:
    postgres:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'postgres') }}"
      port: "{{ env_var('DBT_PORT', '5432') | as_number }}"
      user: "{{ env_var('DBT_USER', 'tabyldieva') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'aiacademy') }}"
      schema: tabyldieva_dbt
      threads: 4
      connect_timeout: 10
